services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend:v1.0.0
    container_name: backend
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
